site_name: nat-zero
site_description: Scale-to-zero NAT instances for AWS
site_url: https://nat-zero.machine.dev
repo_url: https://github.com/MachineDotDev/nat-zero
repo_name: nat-zero

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables

plugins:
  - search

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Performance: performance.md
  - Examples: examples.md
  - Terraform Reference: reference.md
  - Testing: testing.md
  - CI/CD Workflows: workflows.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/MachineDotDev/nat-zero
